; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc1-n16r8]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = espidf
monitor_speed = 115200
; NightMare's logger colours its lines with ANSI codes (NM_LOG_USE_ANSI); the
; default filter would print each ESC as a visible "␛" instead.
monitor_filters = direct
board_build.partitions = partitions.csv
extra_scripts =
	pre:src/Version/script.py
	pre:tools/windows_ldgen.py
; NightMare Network is consumed from the local copy in include/ (read-only
; here) until the gateway moves into that repository.
lib_deps =
	symlink://include/nightmarenetwork
build_flags =
	-DARDUINOJSON_ENABLE_STD_STRING=1
